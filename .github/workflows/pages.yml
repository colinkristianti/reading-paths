name: Publish Reading Paths
on:
  push:
    branches: [main, mobile-first-audio]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check learning logic
        run: node tests.mjs
      - name: Prepare original Taiwan Mandarin recordings
        run: node prepare-audio.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-pronunciation-audio
          path: |
            dist/audio/
            dist/audio-manifest.json
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
